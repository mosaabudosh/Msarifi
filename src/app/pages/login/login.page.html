<div class="login-screen">

  <div class="login-logo">
    <img src="./../../../assets/image/msarifi-logo.png">
  </div>

  <div class="login-title">
    <p>تطبيق إدارة المصاريف الشخصية</p>
  </div>

  <div class="login-card">
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <div class="input-wrap" [class.error]="showError">
        <ion-icon name="lock-closed-outline" class="inp-icon"></ion-icon>
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="أدخل كلمة المرور"
          class="text-inp" (keyup.enter)="doLogin()" />
        <button class="eye-btn" (click)="showPassword = !showPassword" type="button">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
      <p class="error-msg" *ngIf="showError">كلمة المرور غير صحيحة، حاول مرة أخرى</p>
    </div>

    <button class="btn-login" (click)="doLogin()" [disabled]="loading">
      <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
      <ng-container *ngIf="!loading">
        <ion-icon name="log-in-outline"></ion-icon>
        دخول
      </ng-container>
    </button>

    <p *ngIf="showHintPassword" class="hint">كلمة المرور الافتراضية: <strong>1234</strong></p>
  </div>
</div>
